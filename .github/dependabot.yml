# Opens update PRs into dev. Each PR runs the same required checks as any other change.
# Kept quiet on purpose (Adam, 2026-11-12): at most one grouped PR a week per
# ecosystem, small (minor and patch) updates only. Big version jumps are skipped
# here and done deliberately when needed. Security fixes still arrive through
# Dependabot security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-small-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

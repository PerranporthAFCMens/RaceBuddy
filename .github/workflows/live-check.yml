name: Live check

# Runs the full live flow test (scripts/live-check.mts, about 50 checks) against
# the real Supabase project with throwaway users, then deletes them.
#   - after every release (push to main)
#   - every day at 06:00 UTC
#   - by hand: Actions > Live check > Run workflow
# On failure it opens the issue "Live check failing", which emails the repo
# owner, and closes it when the check passes again.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# Until they exist the job skips with a warning.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ypxwqtpdmjmvrdmsedpb.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Secrets present?
        id: keys
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Live check skipped: add the SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.keys.outputs.ready == 'true'
        run: npm ci
      - name: Run the live check
        if: steps.keys.outputs.ready == 'true'
        run: npm run test:live

      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live check failing"
          gh label create live-check-alert --color B60205 --description "Automatic live check alarm" --force --repo "$GITHUB_REPOSITORY" >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-check-alert --state open --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label live-check-alert --body "The automatic live check (real database, throwaway users) failed.

          Details: $RUN_URL

          What to do: open the details link and read the FAIL lines, then ask Claude to look. Test users are deleted even when the check fails.
          This issue closes itself when the check passes again."
          fi
      - name: Clear the alarm
        if: success() && steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label live-check-alert --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"
          done
